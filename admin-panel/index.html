<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conference Admin</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="layout">
      <header class="topbar">
        <div>
          <h1>Conference Admin</h1>
          <p id="sessionStatus">Not connected</p>
        </div>
        <div class="topbar-actions">
          <button id="refreshBtn" type="button" class="icon-button" title="Refresh" disabled aria-label="Refresh">↻</button>
          <button id="signOutBtn" type="button" class="ghost" hidden>Sign out</button>
        </div>
      </header>

      <section id="loginPanel" class="panel">
        <h2>Firebase Access</h2>
        <form id="loginForm" class="grid two-cols">
          <label class="span-2">
            Admin Email
            <input id="email" type="email" autocomplete="username" required />
          </label>
          <label class="span-2">
            Password
            <input id="password" type="password" autocomplete="current-password" required />
          </label>
          <div class="actions span-2">
            <button type="submit">Connect</button>
          </div>
        </form>
        <p id="configStatus" class="config-status">Firebase config loads automatically from Hosting.</p>
      </section>

      <nav class="tabs" aria-label="Admin sections">
        <button id="conferencesTab" type="button" class="tab active" data-tab="conferences" disabled>Conferences</button>
        <button id="ratingsTab" type="button" class="tab" data-tab="ratings" disabled>Ratings</button>
      </nav>

      <section id="conferencesView" class="view active">
        <aside class="panel list-panel">
          <div class="section-title-row">
            <h2>Conferences</h2>
            <button id="newConferenceBtn" type="button" class="ghost" disabled>New</button>
          </div>
          <div id="conferenceList" class="conference-list"></div>
        </aside>

        <section class="panel editor-panel">
          <div class="section-title-row">
            <h2 id="conferenceFormTitle">Conference</h2>
            <button id="deleteConferenceBtn" type="button" class="danger" hidden>Delete</button>
          </div>

          <form id="conferenceForm" class="conference-form">
            <fieldset class="grid three-cols">
              <label>
                ID
                <input id="conferenceId" required placeholder="mmm-2026" />
              </label>
              <label>
                Start Date
                <input id="conferenceStartDate" type="datetime-local" required />
              </label>
              <label>
                Country
                <input id="organizingCountry" required placeholder="ES" />
              </label>
              <label class="span-2">
                Title
                <input id="conferenceTitle" required placeholder="Mobile Meets Mobile 2026" />
              </label>
              <label>
                Event Type
                <input id="eventType" required placeholder="Conference" />
              </label>
              <label class="span-3">
                Audience
                <input id="audience" required placeholder="Developers" />
              </label>
            </fieldset>

            <div class="section-title-row block-title">
              <h3>Rooms</h3>
              <button id="addRoomBtn" type="button" class="ghost">Add Room</button>
            </div>
            <div id="roomsContainer" class="rooms"></div>

            <div class="actions sticky-actions">
              <button type="submit">Save Conference</button>
              <button id="cancelConferenceBtn" type="button" class="ghost">Reset</button>
            </div>
          </form>
        </section>
      </section>

      <section id="ratingsView" class="view">
        <section class="panel">
          <div class="section-title-row">
            <h2>Ratings</h2>
            <select id="ratingsConferenceFilter" disabled aria-label="Conference filter"></select>
          </div>
          <div id="ratingsSummary" class="metric-grid"></div>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Session</th>
                  <th>Votes</th>
                  <th>Average</th>
                  <th>5★</th>
                  <th>4★</th>
                  <th>3★</th>
                  <th>2★</th>
                  <th>1★</th>
                </tr>
              </thead>
              <tbody id="ratingsTableBody"></tbody>
            </table>
          </div>
        </section>
      </section>

      <template id="roomTemplate">
        <article class="nested-item room-item">
          <div class="section-title-row">
            <h4>Room</h4>
            <div class="row-actions">
              <button type="button" class="ghost add-presentation-btn">Add Presentation</button>
              <button type="button" class="danger remove-room-btn">Remove</button>
            </div>
          </div>
          <div class="grid three-cols">
            <label>
              Room ID
              <input class="room-id" required placeholder="main-stage" />
            </label>
            <label class="span-2">
              Name
              <input class="room-name" required placeholder="Main Stage" />
            </label>
            <label class="span-3">
              Description
              <input class="room-description" placeholder="Auditorium" />
            </label>
          </div>
          <div class="presentations"></div>
        </article>
      </template>

      <template id="presentationTemplate">
        <article class="nested-item presentation-item">
          <div class="section-title-row">
            <h4>Presentation</h4>
            <button type="button" class="danger remove-presentation-btn">Remove</button>
          </div>
          <div class="grid four-cols">
            <label>
              ID
              <input class="presentation-id" required placeholder="session-opening" />
            </label>
            <label>
              Start
              <input class="presentation-start-date" type="datetime-local" required />
            </label>
            <label>
              Duration
              <input class="presentation-duration" type="number" min="0" step="5" required value="45" />
            </label>
            <label>
              Technology
              <select class="presentation-technology" required>
                <option>Android</option>
                <option>iOS</option>
                <option>Firebase</option>
                <option>Flutter</option>
                <option>Web</option>
                <option>Cloud</option>
                <option>AI/ML</option>
                <option>Design</option>
                <option>Generic</option>
              </select>
            </label>
            <label class="span-4">
              Title
              <input class="presentation-title" required />
            </label>
            <label class="span-4">
              Description
              <textarea class="presentation-description" rows="3"></textarea>
            </label>
            <label>
              Type
              <select class="presentation-type" required>
                <option>Keynote</option>
                <option>Session</option>
                <option>Workshop</option>
                <option>Codelab</option>
                <option>Office Hours</option>
              </select>
            </label>
            <label class="span-3">
              Presenters
              <input class="presentation-presenters" placeholder="Jane Doe, John Smith" />
            </label>
            <label class="span-4">
              Tags
              <input class="presentation-tags" placeholder="android,kmm,compose" />
            </label>
          </div>
        </article>
      </template>

      <p id="toast" class="toast hidden"></p>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
