<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Admin Panel</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="layout">
      <header class="hero">
        <h1>Event Admin Panel</h1>
        <p>Manage speakers and sessions so the KMM app can be reused for any event.</p>
      </header>

      <section class="card">
        <h2>Supabase Connection</h2>
        <div class="grid two-cols">
          <label>
            Project URL
            <input id="projectUrl" type="url" placeholder="https://xxxxx.supabase.co" />
          </label>
          <label>
            API Key (service role or anon + admin RLS)
            <input id="apiKey" type="password" placeholder="eyJ..." />
          </label>
        </div>
        <div class="actions">
          <button id="connectBtn">Connect</button>
          <button id="loadAllBtn" class="ghost" disabled>Load data</button>
        </div>
        <p id="connectionStatus" class="status">Not connected</p>
      </section>

      <section class="card">
        <div class="section-title-row">
          <h2>Speakers</h2>
          <button id="newSpeakerBtn" class="ghost" disabled>New speaker</button>
        </div>

        <div id="speakerFormContainer" class="form-container hidden">
          <h3 id="speakerFormTitle">New speaker</h3>
          <form id="speakerForm" class="grid two-cols">
            <label>
              ID
              <input id="speakerId" required placeholder="spk-jane-doe" />
            </label>
            <label>
              Name
              <input id="speakerName" required placeholder="Jane Doe" />
            </label>
            <label>
              Role
              <input id="speakerRole" required placeholder="Developer Advocate" />
            </label>
            <label>
              Company
              <input id="speakerCompany" required placeholder="Google" />
            </label>
            <label class="span-2">
              Bio
              <textarea id="speakerBio" rows="3" required></textarea>
            </label>
            <label class="span-2">
              Photo URL
              <input id="speakerPhotoUrl" type="url" required placeholder="https://..." />
            </label>
            <label class="span-2">
              Social Links (JSON)
              <textarea id="speakerSocialLinks" rows="3" placeholder='{"x":"https://x.com/..."}'></textarea>
            </label>
            <div class="actions span-2">
              <button type="submit">Save speaker</button>
              <button type="button" id="cancelSpeakerBtn" class="ghost">Cancel</button>
            </div>
          </form>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Role</th>
                <th>Company</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="speakersTableBody"></tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <div class="section-title-row">
          <h2>Sessions</h2>
          <button id="newSessionBtn" class="ghost" disabled>New session</button>
        </div>

        <div id="sessionFormContainer" class="form-container hidden">
          <h3 id="sessionFormTitle">New session</h3>
          <form id="sessionForm" class="grid three-cols">
            <label>
              ID
              <input id="sessionId" required placeholder="sess-day1-keynote" />
            </label>
            <label>
              Day
              <input id="sessionDay" type="number" min="1" required value="1" />
            </label>
            <label>
              Room
              <input id="sessionRoom" required placeholder="Main Stage" />
            </label>

            <label class="span-3">
              Title
              <input id="sessionTitle" required />
            </label>
            <label class="span-3">
              Description
              <textarea id="sessionDescription" rows="3" required></textarea>
            </label>

            <label>
              Start Time (ISO)
              <input id="sessionStartTime" required placeholder="2026-05-20T09:00:00Z" />
            </label>
            <label>
              End Time (ISO)
              <input id="sessionEndTime" required placeholder="2026-05-20T10:00:00Z" />
            </label>
            <label>
              Duration
              <input id="sessionDuration" required placeholder="60m" />
            </label>

            <label>
              Track
              <select id="sessionTrack" required>
                <option>AI_ML</option>
                <option>ANDROID</option>
                <option>WEB</option>
                <option>CLOUD</option>
                <option>FIREBASE</option>
                <option>FLUTTER</option>
                <option>DESIGN</option>
              </select>
            </label>
            <label>
              Type
              <select id="sessionType" required>
                <option>KEYNOTE</option>
                <option>SESSION</option>
                <option>WORKSHOP</option>
                <option>CODELAB</option>
                <option>OFFICE_HOURS</option>
              </select>
            </label>
            <label>
              Level
              <select id="sessionLevel" required>
                <option>BEGINNER</option>
                <option>INTERMEDIATE</option>
                <option>ADVANCED</option>
              </select>
            </label>

            <label>
              Capacity
              <input id="sessionCapacity" type="number" min="0" required value="0" />
            </label>
            <label>
              Registered
              <input id="sessionRegistered" type="number" min="0" required value="0" />
            </label>
            <label>
              Speaker IDs (comma)
              <input id="sessionSpeakerIds" placeholder="spk-1,spk-2" />
            </label>

            <label class="span-3">
              Tags (comma)
              <input id="sessionTags" placeholder="android,compose,performance" />
            </label>
            <label class="span-3">
              Livestream URL
              <input id="sessionLivestreamUrl" type="url" placeholder="https://..." />
            </label>
            <label class="span-3">
              Slides URL
              <input id="sessionSlidesUrl" type="url" placeholder="https://..." />
            </label>

            <div class="actions span-3">
              <button type="submit">Save session</button>
              <button type="button" id="cancelSessionBtn" class="ghost">Cancel</button>
            </div>
          </form>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Day</th>
                <th>Time</th>
                <th>Title</th>
                <th>Track</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="sessionsTableBody"></tbody>
          </table>
        </div>
      </section>

      <p id="toast" class="toast hidden"></p>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
